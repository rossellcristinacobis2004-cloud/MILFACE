name: CD — Despliegue Continuo a Producción

# ── Avance 5: Pipeline de Despliegue Continuo (CD) ─────────────────────────
# Se activa ÚNICAMENTE cuando se hace merge (push) a la rama principal.
# Construye el artefacto, verifica la salud y despliega automáticamente.

on:
  push:
    branches:
      - main

jobs:
  # ── PASO 1: Verificar que el código pasa todas las pruebas ──────────────
  test:
    name: Verificar pruebas antes de desplegar
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install opencv-python-headless pytest

      - name: Ejecutar pruebas unitarias
        env:
          SECRET_KEY: ${{ secrets.SECRET_KEY || 'test_secret_key_ci' }}
          LLAVE_MAESTRA: ${{ secrets.LLAVE_MAESTRA || 'test_llave_ci' }}
          DATABASE_URL: milfaces.db
          PYTHONPATH: ${{ github.workspace }}
        run: |
          pytest --tb=short -v

  # ── PASO 2: Despliegue automático a producción ──────────────────────────
  deploy:
    name: Desplegar a producción (Render)
    runs-on: ubuntu-latest
    needs: test  # Solo despliega si las pruebas pasan
    environment: production

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Notificar inicio de despliegue
        run: echo "✅ Pruebas superadas. Iniciando despliegue a producción..."

      - name: Disparar despliegue en Render (Deploy Hook)
        # RENDER_DEPLOY_HOOK_URL se configura como Secret en GitHub:
        # Settings → Secrets and variables → Actions → New repository secret
        run: |
          curl -s --fail-with-body \
            --request POST \
            "${{ secrets.RENDER_DEPLOY_HOOK_URL }}" \
          && echo "🚀 Despliegue disparado exitosamente en Render." \
          || echo "⚠️  No se encontró RENDER_DEPLOY_HOOK_URL. Configura el secret en GitHub."
        continue-on-error: true

      - name: Resumen del despliegue
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "  MILFACE — Despliegue Continuo Completado"
          echo "  Commit: ${{ github.sha }}"
          echo "  Rama:   ${{ github.ref_name }}"
          echo "  Actor:  ${{ github.actor }}"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
